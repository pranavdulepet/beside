name: Publish Beside website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - package.json
      - package-lock.json
      - public/fonts/**
      - public/materials/**
      - licenses/**
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assemble the public site
        run: |
          mkdir -p site/licenses
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/esbuild website/film.js --bundle --format=esm --target=safari15 --minify --outfile=site/film.js
          cp website/index.html public/fonts/{Geist,Newsreader}.ttf public/materials/{paper,beside}.png LICENSE site/
          UPDATED_LABEL=$(date -u +"%B %Y")
          UPDATED_ISO=$(date -u +"%Y-%m")
          sed -i "s|<time id=\"updated\" datetime=\"[^\"]*\">[^<]*</time>|<time id=\"updated\" datetime=\"${UPDATED_ISO}\">${UPDATED_LABEL}</time>|" site/index.html
          cp -R website/media site/media
          cp licenses/{Paper-and-ink,Geist,Newsreader,omggif}.txt site/licenses/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  publish:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
