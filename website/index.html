<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beside — a floating assistant for your Mac</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('Geist.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Newsreader;
        src: url('Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: light dark;
        --paper: #faf8f1;
        --ink: #334443;
        --accent: #34656d;
        --hover: #eeeae0;
        --selection: #faeab1;
        --selection-ink: #334443;
      }
      @media (prefers-color-scheme: dark) {
        html {
          --paper: #1c2929;
          --ink: #faf8f1;
          --accent: #a2cccd;
          --hover: #293b3b;
          --selection: #334443;
          --selection-ink: #faeab1;
        }
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px "Söhne", Geist, sans-serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: url('paper.png') repeat;
        opacity: 0.18;
        pointer-events: none;
      }
      body > canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      @media (pointer: coarse) {
        body > canvas { touch-action: pan-y pinch-zoom; }
      }
      main {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        pointer-events: none;
        padding: 28px 16px;
        text-align: center;
      }
      .signature {
        width: 46px;
        height: 38px;
        background: var(--accent);
        -webkit-mask: url('beside.png') center / contain no-repeat;
        mask: url('beside.png') center / contain no-repeat;
      }
      h1 {
        font:
          450 clamp(48px, 6vw, 72px)/1 Newsreader, Georgia, serif;
        letter-spacing: -0.045em;
        margin: 0;
      }
      p {
        margin: 12px 0 18px; max-width: 36rem; text-wrap: balance;
      }
      a {
        pointer-events: auto;
        display: block;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid;
        padding: 5px;
        font-size: 15px;
      }
      #demo { width: min(760px, calc(100vw - 32px)); margin: 22px 0 0; pointer-events: auto; }
      .picker {
        display: flex; align-items: center; gap: 2px; width: max-content;
        max-width: 100%; margin: 0 auto 10px; overflow-x: auto;
        scrollbar-width: none; overscroll-behavior-x: contain;
      }
      .picker::-webkit-scrollbar { display: none; }
      [role="tab"] {
        display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center;
        min-height: 44px; white-space: nowrap; padding: 8px 12px;
        border: 0; border-radius: 7px; cursor: pointer; background: transparent;
        color: inherit; font: 500 15px/1.25 "Söhne", Geist, sans-serif;
      }
      [role="tab"]:hover { background: var(--hover); }
      [role="tab"][aria-selected="true"] { background: var(--selection); color: var(--selection-ink); }
      .picker [role="tab"]:focus-visible { outline-offset: -3px; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      figure { margin: 0; }
      noscript a { display: inline; padding: 0; font: inherit; }
      [hidden] { display: none !important; }
      .player { position: relative; }
      video, .cover img, .direct-recording { display: block; width: 100%; height: auto; aspect-ratio: auto var(--film-ratio, 16 / 10); object-fit: contain; border-radius: 10px; }
      video { background: #263433; }
      .cover img { height: auto; }
      .cover {
        position: absolute; inset: 0; width: 100%; padding: 0; border: 0;
        background: transparent; border-radius: 10px; cursor: pointer; touch-action: manipulation;
      }
      .cover svg {
        position: absolute; inset: 0; margin: auto; width: 54px; height: 54px; padding: 14px;
        border-radius: 50%; background: #1c2929ed; color: #faf8f1;
      }
      .cover img, .cover svg { pointer-events: none; }
      .cover[aria-busy="true"] svg { color: transparent; }
      .cover[aria-busy="true"]::after {
        content: ''; position: absolute; inset: 0; margin: auto; width: 20px; height: 20px;
        border: 2px solid #8b9d99; border-top-color: #faf8f1; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { .cover[aria-busy="true"]::after { animation: none; } }
      .player-message { margin: 10px auto 0; font-size: 14px; }
      .player-message a { display: inline; padding: 0; font: inherit; }
      .film { border-radius: 10px; overflow: hidden; background: #1c2929; color: #faf8f1; }
      .film-screen { position: relative; }
      .film canvas { display: block; width: 100%; height: auto; }
      .film-cue {
        position: absolute; inset: auto 4% 4%; margin: 0 auto; width: fit-content; max-width: 92%;
        background: #142120eb; border-radius: 4px; padding: 3px 8px; font: 500 14px/1.35 Geist, sans-serif;
      }
      .transport { display: flex; align-items: center; gap: 4px; padding: 0 4px; }
      .transport button {
        display: grid; place-items: center; width: 44px; height: 44px; flex: none;
        font: 600 13px Geist, sans-serif; color: inherit; background: transparent; border: 0;
        cursor: pointer; border-radius: 6px; touch-action: manipulation;
      }
      .transport button[aria-pressed="true"] { color: #faeab1; text-decoration: underline; }
      .transport svg { width: 18px; height: 18px; }
      .transport input { flex: 1; min-width: 28px; height: 36px; margin: 0; accent-color: #faeab1; }
      .film-time { font: 12px Geist, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .cinema { inset: 0; max-width: none; max-height: none; width: 100%; height: 100%;
        border: 0; background: #142120; padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .cinema[open] { display: grid; align-items: center; }
      .cinema::backdrop { background: #142120; }
      .cinema .film canvas { max-height: calc(100dvh - 52px); object-fit: contain; }
      figcaption { margin: 11px auto 0; font-size: 14px; line-height: 1.5; text-wrap: balance; }
      small { margin-top: 9px; font-size: 12px; }
      small a { display: inline; padding: 0; font: inherit; }
    </style>
    <noscript><style>.picker, .player, #caption, body > canvas { display: none; }</style></noscript>
  </head>
  <body>
    <canvas aria-label="Draw with ink on the paper"></canvas>
    <main>
      <span class="signature" aria-hidden="true"></span>
      <h1>Beside</h1>
      <p>A floating assistant for whatever’s open on your Mac.</p>
      <a href="https://github.com/pranavdulepet/beside/releases/latest/download/Beside-macOS.zip" download>Download for Mac ↓</a>
      <small>Apple silicon · macOS 14+ · <a href="https://github.com/pranavdulepet/beside#try-beside">Install guide</a> · <a href="https://github.com/pranavdulepet/beside/blob/main/docs/guide.md#where-your-data-lives">Privacy</a></small>
      <section id="demo" aria-label="Beside on a Mac">
        <div class="picker" role="tablist" aria-label="Choose a walkthrough">
          <button id="tab-writing" role="tab" aria-controls="demo-panel" aria-selected="true" data-take="10" data-caption="Who counted the 64 gates? Check two sources while writing about Chandragupta Maurya.">Writing</button>
          <button id="tab-groceries" role="tab" aria-controls="demo-panel" aria-selected="false" tabindex="-1" data-take="8" data-caption="Two more people are coming. Buy 8 tortillas, skip the beans, and paste the list into Notes.">Groceries</button>
          <button id="tab-flight" role="tab" aria-controls="demo-panel" aria-selected="false" tabindex="-1" data-file="baggage" data-ratio="90 / 49" data-take="9" data-caption="At Ryanair checkout, Beside checks the Athens packing list and forecast before recommending you skip the £41.49 extra bag.">Flight</button>
        </div>
        <figure id="demo-panel" role="tabpanel" aria-labelledby="tab-writing">
          <div class="player">
            <video controls playsinline muted preload="none" poster="media/writing.png?take=10" aria-describedby="caption" aria-label="Writing walkthrough">
              <track kind="captions" srclang="en" label="English" src="media/writing.vtt?take=10" />
            </video>
            <div class="film" hidden>
              <div class="film-screen">
                <canvas width="1024" height="640" role="img" aria-label="Writing walkthrough"></canvas>
                <p class="film-cue" hidden></p>
              </div>
              <div class="transport" role="group" aria-label="Recording controls">
                <button type="button" class="toggle" aria-label="Pause recording">
                  <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4 3h4v14H4zm8 0h4v14h-4z"/></svg>
                </button>
                <input type="range" min="0" step="0.01" value="0" aria-label="Recording position" />
                <span class="film-time">0:00</span>
                <button type="button" class="captions" aria-label="Captions" aria-pressed="false">CC</button>
                <button type="button" class="expand" aria-label="Expand recording">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 8V3h5m4 0h5v5m0 4v5h-5m-4 0H3v-5"/></svg>
                </button>
              </div>
            </div>
            <img class="direct-recording" alt="Writing walkthrough" tabindex="-1" hidden />
            <button type="button" class="cover" aria-label="Play Writing walkthrough" hidden>
              <img src="media/writing.png?take=10" width="1536" height="960" alt="" />
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.6a1 1 0 0 1 1.5-.86l14 8.4a1 1 0 0 1 0 1.72l-14 8.4A1 1 0 0 1 6 20.4z"/></svg>
            </button>
          </div>
          <p class="player-message" role="status" hidden>Couldn’t load the recording. <a href="https://github.com/pranavdulepet/beside/raw/refs/heads/main/website/media/writing.mp4" download>Download the MP4</a></p>
          <figcaption id="caption">Who counted the 64 gates? Check two sources while writing about Chandragupta Maurya.</figcaption>
          <noscript><p>Open a recording in your media player.</p><p>
            <a href="media/writing.mp4">Writing</a> · <a href="media/groceries.mp4">Groceries</a> · <a href="media/baggage.mp4">Flight</a>
          </p></noscript>
        </figure>
      </section>
    </main>
    <dialog class="cinema" aria-label="Expanded walkthrough"></dialog>
    <script type="module">
      if (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname)) {
        document.querySelector('a[download]').href = 'Beside-macOS.zip';
      }
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const imagePlayback = new URLSearchParams(location.search).get('player') === 'images';
      const panel = document.querySelector('#demo-panel');
      const video = panel.querySelector('video');
      const cover = panel.querySelector('.cover');
      const message = panel.querySelector('.player-message');
      const caption = panel.querySelector('figcaption');
      const film = panel.querySelector('.film');
      const direct = panel.querySelector('.direct-recording');
      let closePlayer;
      function preparePlayer(tab, file) {
        closePlayer?.();
        const base = 'media/' + file;
        const media = extension => base + '.' + extension + '?take=' + tab.dataset.take;
        panel.style.setProperty('--film-ratio', tab.dataset.ratio || '16 / 10');
        const animationUrl = media('gif');
        const label = tab.textContent + ' walkthrough';
        const controller = new AbortController();
        const {signal} = controller;
        let mode = 'poster', timeout, firstFrame;
        video.hidden = false;
        video.controls = false;
        video.tabIndex = -1;
        video.poster = media('png');
        video.setAttribute('aria-label', label);
        video.querySelector('track').src = media('vtt');
        direct.alt = label;
        cover.querySelector('img').src = video.poster;
        cover.setAttribute('aria-label', 'Play ' + label);
        cover.removeAttribute('aria-busy');
        cover.hidden = false;
        message.querySelector('a').href = 'https://github.com/pranavdulepet/beside/raw/refs/heads/main/website/media/' + file + '.mp4';
        message.hidden = true;

        function reveal(control = video) {
          const movedFromCover = document.activeElement === cover;
          cover.removeAttribute('aria-busy');
          cover.hidden = true;
          message.hidden = true;
          if (control === video) video.tabIndex = 0;
          if (movedFromCover) control.focus({preventScroll: true});
        }
        async function playImages() {
          if (signal.aborted || mode === 'images') return;
          const startAt = video.currentTime || 0;
          mode = 'images';
          if (firstFrame !== undefined) video.cancelVideoFrameCallback(firstFrame);
          firstFrame = undefined;
          clearTimeout(timeout);
          video.pause();
          video.removeAttribute('src');
          video.load();
          cover.hidden = false;
          cover.setAttribute('aria-busy', 'true');
          try {
            const [module, response] = await Promise.all([
              import('./film.js?take=8'), fetch(animationUrl, {signal}),
            ]);
            if (!response.ok) throw new Error('Recording unavailable');
            const bytes = await response.arrayBuffer();
            if (signal.aborted) return;
            module.playFilm(film, bytes, {label, captionsUrl: media('vtt'), startAt, signal});
            video.hidden = true;
            reveal(film.querySelector('.toggle'));
          } catch {
            if (signal.aborted) return;
            // A plain image can also play when a browser blocks fetch or scripts.
            direct.onload = () => {
              video.hidden = true;
              direct.hidden = false;
              reveal(direct);
            };
            direct.onerror = () => {
              mode = 'poster';
              cover.removeAttribute('aria-busy');
              message.hidden = false;
            };
            direct.src = animationUrl;
          }
        }
        function watchForStall() {
          clearTimeout(timeout);
          timeout = setTimeout(playImages, 3500);
        }
        cover.onclick = () => {
          if (mode !== 'poster') return;
          cover.setAttribute('aria-busy', 'true');
          if (imagePlayback || !video.canPlayType('video/mp4')) {
            playImages();
            return;
          }
          mode = 'video';
          video.src = media('mp4');
          video.controls = true;
          if ('requestVideoFrameCallback' in video) {
            firstFrame = video.requestVideoFrameCallback(() => {
              if (mode !== 'video' || signal.aborted) return;
              clearTimeout(timeout);
              reveal();
            });
          }
          watchForStall();
          video.play().catch(() => { if (mode === 'video') playImages(); });
        };
        video.addEventListener('error', () => { if (mode === 'video') playImages(); }, {signal});
        video.addEventListener('progress', () => {
          if (mode === 'video' && !cover.hidden) watchForStall();
        }, {signal});
        video.addEventListener('waiting', () => {
          if (mode === 'video' && !video.paused) watchForStall();
        }, {signal});
        video.addEventListener('playing', () => {
          if (mode !== 'video') return;
          if (cover.hidden || !('requestVideoFrameCallback' in video)) {
            clearTimeout(timeout);
            reveal();
          }
        }, {signal});
        video.addEventListener('pause', () => { if (cover.hidden) clearTimeout(timeout); }, {signal});
        closePlayer = () => {
          controller.abort();
          clearTimeout(timeout);
          if (firstFrame !== undefined) video.cancelVideoFrameCallback(firstFrame);
          video.pause();
          video.removeAttribute('src');
          video.load();
          direct.onload = direct.onerror = null;
          direct.removeAttribute('src');
          direct.hidden = true;
        };
      }
      function selectDemo(tab, updateAddress) {
        const id = tab.id.slice(4);
        if (closePlayer && tab.getAttribute('aria-selected') === 'true') return;
        for (const item of tabs) {
          item.setAttribute('aria-selected', String(item === tab));
          item.tabIndex = item === tab ? 0 : -1;
        }
        const file = tab.dataset.file || id;
        preparePlayer(tab, file);
        panel.setAttribute('aria-labelledby', tab.id);
        caption.textContent = tab.dataset.caption;
        if (updateAddress) history.replaceState(null, '', '#' + id);
      }
      for (const [index, tab] of tabs.entries()) {
        tab.onclick = () => selectDemo(tab, true);
        tab.onkeydown = event => {
          const next = {ArrowLeft: (index + tabs.length - 1) % tabs.length,
            ArrowRight: (index + 1) % tabs.length, Home: 0, End: tabs.length - 1}[event.key];
          if (next === undefined) return;
          event.preventDefault();
          const choice = tabs[next];
          choice.focus({preventScroll: true});
          choice.scrollIntoView({block: 'nearest', inline: 'nearest'});
          selectDemo(choice, true);
        };
      }
      const readAddress = () => selectDemo(tabs.find(tab => tab.id === 'tab-' + location.hash.slice(1)) || tabs[0], false);
      addEventListener('hashchange', readAddress);
      readAddress();
      const canvas = document.querySelector('canvas');
      const ink = canvas.getContext('2d');
      const dark = matchMedia('(prefers-color-scheme: dark)');
      const still = matchMedia('(prefers-reduced-motion: reduce)');
      const strokes = [];
      let active, pointer, frame;

      function paint(from, to, spread) {
        ink.beginPath();
        ink.moveTo(from.x, from.y);
        ink.lineTo(to.x + 0.01, to.y + 0.01);
        ink.lineCap = 'round';
        ink.strokeStyle = dark.matches ? '#a2cccd' : '#34656d';
        ink.lineWidth = (from.w + to.w) / 2 + spread;
        ink.globalAlpha = spread ? 0.09 : 0.85;
        ink.stroke();
      }
      function render(time) {
        ink.clearRect(0, 0, innerWidth, innerHeight);
        let wet = false;
        for (const stroke of strokes) {
          const age = still.matches ? 1 : Math.min(1, (time - stroke.at) / 650);
          const bleed = 0.2 + 2.2 * Math.max(0, age);
          wet ||= age < 1;
          stroke.points.forEach((point, i) => {
            const previous = stroke.points[Math.max(0, i - 1)];
            paint(previous, point, bleed);
            paint(previous, point, 0);
          });
        }
        frame = wet ? requestAnimationFrame(render) : null;
      }
      function schedule() {
        if (!frame) frame = requestAnimationFrame(render);
      }
      function resize() {
        const scale = Math.min(devicePixelRatio, 3);
        canvas.width = Math.round(innerWidth * scale);
        canvas.height = Math.round(innerHeight * scale);
        ink.setTransform(scale, 0, 0, scale, 0, 0);
        schedule();
      }
      function point(e) {
        return {x: e.clientX, y: e.clientY, w: 0.8 + 5 * (e.pressure || 0.45)};
      }
      canvas.onpointerdown = e => {
        if (!e.isPrimary || e.button !== 0) return;
        pointer = e.pointerId;
        canvas.setPointerCapture(pointer);
        active = {at: performance.now(), points: [point(e)]};
        strokes.push(active);
        schedule();
      };
      canvas.onpointermove = e => {
        if (!active || e.pointerId !== pointer) return;
        active.points.push(point(e));
        active.at = performance.now();
        schedule();
      };
      canvas.onpointercancel = e => {
        if (active && e.pointerId === pointer) {
          strokes.pop();
          active = null;
          schedule();
        }
      };
      canvas.onlostpointercapture = () => { active = null; };
      dark.addEventListener('change', schedule);
      still.addEventListener('change', schedule);
      addEventListener('resize', resize);
      resize();
    </script>
  </body>
</html>
