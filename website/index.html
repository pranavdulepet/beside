<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beside — a floating assistant for your Mac</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('Geist.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Newsreader;
        src: url('Newsreader.ttf') format('truetype');
        font-weight: 200 800;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: light-dark(#faf8f1, #1c2929);
        color: light-dark(#334443, #faf8f1);
        font:
          17px "Söhne", Geist, sans-serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: url('paper.png') repeat;
        opacity: 0.18;
        pointer-events: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      main {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        pointer-events: none;
        padding: 28px 16px;
        text-align: center;
      }
      .signature {
        width: 46px;
        height: 38px;
        background: light-dark(#34656d, #a2cccd);
        mask: url('beside.png') center / contain no-repeat;
      }
      h1 {
        font:
          450 clamp(48px, 6vw, 72px)/1 Newsreader, Georgia, serif;
        letter-spacing: -0.045em;
        margin: 0;
      }
      p {
        margin: 12px 0 18px; max-width: 36rem; text-wrap: balance;
      }
      a {
        pointer-events: auto;
        display: block;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid;
        padding: 5px;
        font-size: 15px;
      }
      #demo { width: min(840px, calc(100vw - 32px)); margin: 26px 0 0; }
      [role="tablist"] {
        display: inline-flex; gap: 3px; margin-bottom: 12px;
        pointer-events: auto;
      }
      [role="tab"] {
        font: inherit; font-size: 15px; font-weight: 500; color: inherit;
        background: transparent; border: 0; border-radius: 7px;
        padding: 8px 15px; min-height: 40px; cursor: pointer;
      }
      [role="tab"]:hover { background: light-dark(#eeeae0, #293b3b); }
      [role="tab"][aria-selected="true"] {
        background: light-dark(#faeab1, #334443); color: light-dark(#334443, #faeab1);
      }
      :focus-visible { outline: 2px solid light-dark(#34656d, #a2cccd); outline-offset: 3px; }
      figure { margin: 0; }
      video { width: 100%; aspect-ratio: 2 / 1; object-fit: contain; display: block;
        background: light-dark(#e9e8df, #263433); pointer-events: auto; border-radius: 10px; }
      figcaption { margin: 11px auto 0; font-size: 14px; line-height: 1.5; text-wrap: balance; }
      small { margin-top: 9px; font-size: 12px; }
      small a { display: inline; padding: 0; font: inherit; }
    </style>
  </head>
  <body>
    <canvas aria-label="Draw with ink on the paper"></canvas>
    <main>
      <span class="signature" aria-hidden="true"></span>
      <h1>Beside</h1>
      <p>A floating assistant for whatever’s open on your Mac.</p>
      <a href="https://github.com/pranavdulepet/beside/releases/latest/download/Beside-macOS.zip" download>Download for Mac ↓</a>
      <small>Apple silicon · macOS 14+ · <a href="https://github.com/pranavdulepet/beside#try-beside">Setup</a></small>
      <section id="demo" aria-label="Beside on a Mac">
        <div role="tablist" aria-label="Choose a walkthrough">
          <button id="writing" role="tab" aria-controls="demo-panel" aria-selected="true">Writing</button>
          <button id="groceries" role="tab" aria-controls="demo-panel" aria-selected="false" tabindex="-1">Groceries</button>
          <button id="flight" role="tab" aria-controls="demo-panel" aria-selected="false" tabindex="-1">Flight</button>
        </div>
        <figure id="demo-panel" role="tabpanel" aria-labelledby="writing">
          <video controls playsinline preload="metadata" poster="media/writing.png" src="media/writing.mp4" aria-describedby="caption" aria-label="Writing walkthrough">
            <track kind="captions" srclang="en" label="English" src="media/writing.vtt" />
          </video>
          <figcaption id="caption">Check a detail about Chandragupta Maurya’s capital, then revise the essay in TextEdit.</figcaption>
        </figure>
      </section>
    </main>
    <script>
      if (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname)) {
        document.querySelector('a[download]').href = 'Beside-macOS.zip';
      }
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panel = document.querySelector('#demo-panel');
      const video = panel.querySelector('video');
      const caption = panel.querySelector('figcaption');
      const demos = {
        writing: ['writing', caption.textContent],
        groceries: ['groceries', 'Turn a week of meals into a Trader Joe’s shopping list and paste it into Apple Notes.'],
        flight: ['baggage', 'Compare an Athens packing list with the second-bag fee at United checkout.'],
      };
      function selectDemo(id, updateAddress) {
        const tab = tabs.find(item => item.id === id) || tabs[0];
        if (tab.getAttribute('aria-selected') === 'true') return;
        for (const item of tabs) {
          item.setAttribute('aria-selected', String(item === tab));
          item.tabIndex = item === tab ? 0 : -1;
        }
        const [file, line] = demos[tab.id];
        video.pause();
        video.poster = 'media/' + file + '.png';
        video.src = 'media/' + file + '.mp4';
        video.setAttribute('aria-label', tab.textContent + ' walkthrough');
        video.querySelector('track').src = 'media/' + file + '.vtt';
        video.load();
        panel.setAttribute('aria-labelledby', tab.id);
        caption.textContent = line;
        if (updateAddress) history.replaceState(null, '', '#' + tab.id);
      }
      for (const [i, tab] of tabs.entries()) {
        tab.onclick = () => selectDemo(tab.id, true);
        tab.onkeydown = event => {
          const next = {ArrowLeft: (i + tabs.length - 1) % tabs.length, ArrowRight: (i + 1) % tabs.length,
                        Home: 0, End: tabs.length - 1}[event.key];
          if (next === undefined) return;
          event.preventDefault();
          tabs[next].focus();
          selectDemo(tabs[next].id, true);
        };
      }
      const readAddress = () => selectDemo(location.hash.slice(1), false);
      addEventListener('hashchange', readAddress);
      readAddress();
      const canvas = document.querySelector('canvas');
      const ink = canvas.getContext('2d');
      const dark = matchMedia('(prefers-color-scheme: dark)');
      const still = matchMedia('(prefers-reduced-motion: reduce)');
      const strokes = [];
      let active, pointer, frame;

      function paint(from, to, spread) {
        ink.beginPath();
        ink.moveTo(from.x, from.y);
        ink.lineTo(to.x + 0.01, to.y + 0.01);
        ink.lineCap = 'round';
        ink.strokeStyle = dark.matches ? '#a2cccd' : '#34656d';
        ink.lineWidth = (from.w + to.w) / 2 + spread;
        ink.globalAlpha = spread ? 0.09 : 0.85;
        ink.stroke();
      }
      function render(time) {
        ink.clearRect(0, 0, innerWidth, innerHeight);
        let wet = false;
        for (const stroke of strokes) {
          const age = still.matches ? 1 : Math.min(1, (time - stroke.at) / 650);
          const bleed = 0.2 + 2.2 * Math.max(0, age);
          wet ||= age < 1;
          stroke.points.forEach((point, i) => {
            const previous = stroke.points[Math.max(0, i - 1)];
            paint(previous, point, bleed);
            paint(previous, point, 0);
          });
        }
        frame = wet ? requestAnimationFrame(render) : null;
      }
      function schedule() {
        if (!frame) frame = requestAnimationFrame(render);
      }
      function resize() {
        const scale = Math.min(devicePixelRatio, 3);
        canvas.width = Math.round(innerWidth * scale);
        canvas.height = Math.round(innerHeight * scale);
        ink.setTransform(scale, 0, 0, scale, 0, 0);
        schedule();
      }
      function point(e) {
        return {x: e.clientX, y: e.clientY, w: 0.8 + 5 * (e.pressure || 0.45)};
      }
      canvas.onpointerdown = e => {
        if (!e.isPrimary || e.button !== 0) return;
        pointer = e.pointerId;
        canvas.setPointerCapture(pointer);
        active = {at: performance.now(), points: [point(e)]};
        strokes.push(active);
        schedule();
      };
      canvas.onpointermove = e => {
        if (!active || e.pointerId !== pointer) return;
        active.points.push(point(e));
        active.at = performance.now();
        schedule();
      };
      canvas.onlostpointercapture = () => { active = null; };
      dark.addEventListener('change', schedule);
      still.addEventListener('change', schedule);
      addEventListener('resize', resize);
      resize();
    </script>
  </body>
</html>
